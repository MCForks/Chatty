name: Automated release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Build changelog and release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Build and publish artifacts
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release_please.outputs.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release
        run: >-
          ./gradlew clean build --no-daemon
          -PchattyVersion=${{ needs.release_please.outputs.version }}

      - name: Verify release artifact
        env:
          VERSION: ${{ needs.release_please.outputs.version }}
        run: |
          artifact="build/libs/Chatty-${VERSION}.jar"
          test -f "$artifact"
          sha256sum "$artifact" > "${artifact}.sha256"

      - name: Save workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Chatty-${{ needs.release_please.outputs.version }}
          path: |
            build/libs/Chatty-${{ needs.release_please.outputs.version }}.jar
            build/libs/Chatty-${{ needs.release_please.outputs.version }}.jar.sha256
          if-no-files-found: error

      - name: Attach files to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release_please.outputs.tag_name }}
          VERSION: ${{ needs.release_please.outputs.version }}
        run: |
          artifact="build/libs/Chatty-${VERSION}.jar"
          gh release upload "$TAG" "$artifact" "${artifact}.sha256" --clobber

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release_please.outputs.tag_name }}
          VERSION: ${{ needs.release_please.outputs.version }}
        run: gh release edit "$TAG" --draft=false --title "Chatty $VERSION"
