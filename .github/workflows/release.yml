name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew clean test --no-daemon

  build:
    name: Build plugin
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        env:
          BOOTSTRAP_SHA: 4c24014631d371a6845bddb979fb7cddbf5fe183
          INITIAL_TAG: v2.19.14
        run: bash .github/scripts/prepare-release.sh

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$PUBLISH" == "true" ]]; then
            ./gradlew clean assemble --no-daemon "-PchattyVersion=$VERSION"
          else
            ./gradlew clean assemble --no-daemon
          fi

      - name: Verify build artifact
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$PUBLISH" == "true" ]]; then
            artifact="build/libs/Chatty-${VERSION}.jar"
          else
            artifact="$(find build/libs -maxdepth 1 -name 'Chatty-*.jar' -print -quit)"
          fi
          test -n "$artifact"
          test -f "$artifact"
          sha256sum "$artifact" > "${artifact}.sha256"

      - name: Save plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-build
          path: |
            build/libs/Chatty-*.jar
            build/libs/Chatty-*.jar.sha256
          if-no-files-found: error

      - name: Save release metadata
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: release-notes.md
          if-no-files-found: error

  smoke:
    name: Run smoke tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download built plugin
        uses: actions/download-artifact@v8
        with:
          name: plugin-build
          path: build/libs

      - name: Boot Paper and run integration scenarios
        run: bash scripts/smoke-test.sh

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-logs
          path: build/smoke-test/
          if-no-files-found: ignore

  publish:
    name: Publish GitHub release
    needs:
      - build
      - smoke
    if: ${{ needs.build.outputs.publish == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download built plugin
        uses: actions/download-artifact@v8
        with:
          name: plugin-build
          path: build/libs

      - name: Download release metadata
        uses: actions/download-artifact@v8
        with:
          name: release-metadata

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          artifact="build/libs/Chatty-${VERSION}.jar"
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$artifact" "${artifact}.sha256" \
              --repo "$REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$REPOSITORY" \
              --title "Chatty $VERSION" \
              --notes-file release-notes.md \
              --draft=false
          else
            gh release create "$TAG" \
              "$artifact" \
              "${artifact}.sha256" \
              --repo "$REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Chatty $VERSION" \
              --notes-file release-notes.md
          fi
