name: Automated release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        env:
          BOOTSTRAP_SHA: 4c24014631d371a6845bddb979fb7cddbf5fe183
          INITIAL_TAG: v2.19.14
        run: bash .github/scripts/prepare-release.sh

      - name: Set up Java 25
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: gradle/actions/setup-gradle@v6

      - name: Build release
        if: ${{ steps.release.outputs.publish == 'true' }}
        run: >-
          ./gradlew clean build --no-daemon
          -PchattyVersion=${{ steps.release.outputs.version }}

      - name: Verify release artifact
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          artifact="build/libs/Chatty-${VERSION}.jar"
          test -f "$artifact"
          sha256sum "$artifact" > "${artifact}.sha256"

      - name: Save workflow artifact
        if: ${{ steps.release.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Chatty-${{ steps.release.outputs.version }}
          path: |
            build/libs/Chatty-${{ steps.release.outputs.version }}.jar
            build/libs/Chatty-${{ steps.release.outputs.version }}.jar.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          artifact="build/libs/Chatty-${VERSION}.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$artifact" "${artifact}.sha256" --clobber
            gh release edit "$TAG" \
              --title "Chatty $VERSION" \
              --notes-file release-notes.md \
              --draft=false
          else
            gh release create "$TAG" \
              "$artifact" \
              "${artifact}.sha256" \
              --target "$GITHUB_SHA" \
              --title "Chatty $VERSION" \
              --notes-file release-notes.md
          fi
