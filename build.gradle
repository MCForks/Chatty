plugins {
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
}

allprojects {
    group = 'ru.brikster'
    // Overridable from the release workflow: -PchattyVersion=3.0.0
    version = providers.gradleProperty('chattyVersion').getOrElse('3.0.0-SNAPSHOT')
}

subprojects {
    pluginManager.apply('java-library')

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(25))
        }
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks {
        compileJava {
            options.encoding = 'UTF-8'
        }

        compileTestJava {
            options.encoding = 'UTF-8'
        }

        test {
            useJUnitPlatform()
        }
    }

    repositories {
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://hub.spigotmc.org/nexus/content/groups/public/' }
        maven {
            name = "sonatype-oss-snapshots1"
            url = "https://s01.oss.sonatype.org/content/repositories/snapshots/"
        }
    }

    def adventureVersion = "5.2.0"

    dependencies {
        compileOnlyApi 'org.jetbrains:annotations:17.0.0'

        compileOnlyApi "net.kyori:adventure-api:$adventureVersion"
        compileOnlyApi "net.kyori:adventure-text-minimessage:$adventureVersion"
        compileOnlyApi "net.kyori:adventure-text-serializer-gson:$adventureVersion"
        compileOnlyApi "net.kyori:adventure-text-serializer-legacy:$adventureVersion"
        compileOnlyApi "net.kyori:adventure-text-serializer-plain:$adventureVersion"

        compileOnly 'io.papermc.paper:paper-api:26.2.build.60-beta'

        implementation 'com.google.inject:guice:5.1.0'
        implementation 'com.google.guava:guava:30.1-jre'

        compileOnly 'org.projectlombok:lombok:1.18.46'
        annotationProcessor 'org.projectlombok:lombok:1.18.46'

        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
